  - id: long-08
    description: "Contradiction detection during long conversation"
    turns:
      - "Traditional oak staircase."
      - "Turned spindles."
      - "Bullnose starting step."
      - "Actually — modern minimalist balustrade."
      - "Matt-black metal rods."
      - "Wait — but keep the volute at the bottom."
      - "The turned newel too."
      - "Landing to match the balustrade."
