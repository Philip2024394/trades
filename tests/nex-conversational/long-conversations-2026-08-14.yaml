      balustrade_material: matt_black_metal
      concepts_visited_includes: [design_style, timber_species, balusters, starting_steps, landing_railings, newel_caps]
    expected_contradictions_at_least: 1
    expected_next_action: Ask

  - id: long-09
    description: "Cost + design + code compound routed cleanly"
    turns:
      - "Modern staircase for the entry hall."
      - "Cantilever if possible."
      - "Oak throughout."
