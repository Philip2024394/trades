      - "What kinds of changes are possible?"
      - "Something simple — I don't want a full rebuild."
      - "The current stairs are pine."
      - "Something warmer looking."
      - "Not modern — I don't like matt black or glass."
      - "More traditional but not Victorian."
      - "Cottage-modern maybe."
      - "What would you recommend?"
    expected_final_state:
