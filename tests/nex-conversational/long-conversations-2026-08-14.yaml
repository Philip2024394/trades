      - "OK — I'll get quotes from a builder for that."
      - "On design: matt-black metal rods or brushed stainless?"
      - "What does building regs say about handrail height on cantilevers?"
      - "OK — check with inspector."
      - "Back to design — matt black or brushed stainless?"
      - "Modern-industrial feel is what I want."
    expected_final_state:
      style: modern
      timber_species: oak
      concepts_visited_includes: [design_style, stringers, timber_species, balusters, business_estimation, safety_regs]
    expected_next_action: Recommend

  - id: long-10
