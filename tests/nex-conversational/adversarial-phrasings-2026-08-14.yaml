# NEX Adversarial Phrasings Test Set · v2 comprehensive (Philip 2026-08-14 Speaking Layer directive)
#
# Measures: does NEX correctly route many different phrasings of THE SAME
# underlying intent to the same concept?
#
# Coverage: 15 concept families x multiple concepts per family x 8-12 phrasings each.
# Each concept block tests 8-12 different ways a customer might express the same intent.
# A concept "passes" only if all phrasings within it route to the same (family, tier) pair.

meta:
  suite: adversarial-phrasings-v2-comprehensive
  version: 2.0
  created: 2026-08-14
  provenance: philip-speaking-layer-directive-2026-08-14
  scale: 30_concepts_300_plus_phrasings
  purpose: measure_language_coverage_across_15_families_and_21_question_types

