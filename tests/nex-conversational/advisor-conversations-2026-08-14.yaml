# NEX Layer 4 · Advisor Reasoning Test Suite (Philip 2026-08-14)
#
# Measures whether NEX makes the RIGHT DECISION given a conversation.
# For each test: what action + response_shape should the AdvisorDecision return?
#
# 100 conversations across 15 categories.
# Format per test:
#   turns: array of customer utterances
#   category: one of the 15 categories
#   expected_action: Answer | Ask | Recommend | Compare | RetrieveImages | Route | Refuse
#   expected_response_shape: Explain | Options | Recommendation | Clarification
#   expected_confidence: Clear | Likely | Ambiguous (optional)
#   expected_missing_includes: [required missing-info items] (optional)
#   expected_evidence_covers: [required covered concepts] (optional)
#   expected_evidence_routes: [required routed concepts] (optional)

tests:

  # =====================================================
  # A · Sufficient evidence (10) — should Answer or Recommend
  # =====================================================
  - id: adv-A-01
    category: sufficient_evidence
    turns:
      - "What is a bullnose starting step?"
