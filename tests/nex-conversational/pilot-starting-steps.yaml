# NEX Conversational Intelligence · Pilot Test Suite
# Every test is scored against the conversational-intelligence files, not against a live NEX runtime.
# Scoring dimensions per test:
#   1. Interpretation — customer phrase mapped in customer-language-glossary.md
#   2. Intent tier — intent-patterns.md classifies to expected tier (Clear/Likely/Ambiguous)
#   3. Retrieval — expected Reference Brain sources cited in intent-patterns.md OR customer-intent-scenarios.md
#   4. Response-shape — matching response shape available (direct / hedged+follow-up / ask-first)
# Coverage % = (tests scoring 4/4) / total tests

meta:
  suite: pilot-starting-steps
  version: 1.0
  created: 2026-08-14
  provenance: philip-approved-2026-08-14 (12 example customer phrases + derived)

