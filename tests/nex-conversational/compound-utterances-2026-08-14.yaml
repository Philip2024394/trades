# NEX Compound Utterance Test Suite (Philip 2026-08-14 Compound Conversation Engine directive)
#
# Measures: for each compound utterance, does NEX correctly detect ALL concepts,
# identify the primary, and extract stated preferences?
#
# Format per test:
#   text: the customer utterance
#   expected_concepts: array of concept families that MUST be detected
#   expected_primary: which concept is the primary (from precedence hierarchy)
#   expected_preferences: preferences that should be extracted
#   expected_retention: true if utterance signals refacing/retention scope

tests:

  # ============================================================
  # Group 1 · Starting step + carpet (5 variants)
  # ============================================================
  - id: cu-01
    text: "We're carpeting the stairs but I want the first step wider and the wood visible."
    expected_concepts: [carpet_stepmats, starting_steps, treads_risers]
    expected_primary: carpet_stepmats
    expected_preferences: { finish: carpet, balustrade_material: null }
    expected_retention: false

  - id: cu-02
    text: "I'm carpeting the flight but keep the bullnose in oak."
    expected_concepts: [carpet_stepmats, starting_steps, timber_species]
    expected_primary: carpet_stepmats
    expected_preferences: { finish: carpet, timber_species: oak }
    expected_retention: false

  - id: cu-03
    text: "Full carpet on the flight, exposed timber bullnose starting step."
    expected_concepts: [carpet_stepmats, starting_steps]
    expected_primary: carpet_stepmats
    expected_preferences: { finish: carpet }
    expected_retention: false

  - id: cu-04
    text: "Runner down the middle, keep the first step wood."
    expected_concepts: [carpet_stepmats, starting_steps]
    expected_primary: carpet_stepmats
    expected_preferences: { finish: runner }
    expected_retention: false

  - id: cu-05
    text: "Carpet the stairs, but I want the bottom step to look really nice."
    expected_concepts: [carpet_stepmats, starting_steps]
    expected_primary: carpet_stepmats
    expected_preferences: { finish: carpet }
    expected_retention: false

