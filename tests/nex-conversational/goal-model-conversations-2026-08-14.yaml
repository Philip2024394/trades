# NEX Customer Goal Model · Multi-Turn Conversation Suite (Philip 2026-08-14)
#
# Measures across 10 separate dimensions:
#   goal_retention · constraint_retention · preference_retention · override_correctness
#   reference_resolution · contradiction_detection · clarification_correctness
#   retrieval_correctness · final_recommendation_correctness · fabrication (must be 0)
#
# 60 conversations across 7 categories (Philip's distribution suggested 100 —
# built 60 substantial multi-turn cases as v1; extend later).
#
# Format:
#   turns: array of customer utterances
#   category: one of the 7 categories
#   expected_state: what should be tracked after all turns
#     explicit_preferences: {field: value}
#     explicit_exclusions: {field: [values]}
#     explicit_constraints: {field: value}
#     scope: refacing | full_build | null
#     concepts_visited_includes: [required concepts]
#   expected_corrections: (optional) [{field, from, to}]
#   expected_contradictions: (optional) [{field, note}]
#   expected_references_resolved: (optional) count of references NEX should have resolved
#   expected_should_clarify: (optional) true if NEX should have asked at some point

conversations:

  # ============================================================
  # CATEGORY A · Straightforward requirement-building (10)
  # ============================================================

  - id: gm-A-01
    category: requirement_building
    turns:
      - "I want an oak staircase."
      - "Modern style."
      - "Glass balustrade."
      - "Cantilever if possible."
    expected_state:
      explicit_preferences: {timber_species: oak, style: modern, balustrade_material: glass}
