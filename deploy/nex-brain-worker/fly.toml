# NEX Brain Cloud Worker — Fly.io app definition
# Philip 2026-08-06 · Phase 5
#
# ═══════════════════════════════════════════════════════════════════
# ⚠ DECOMMISSIONED 2026-08-09 · Headquarters Production Readiness
# ═══════════════════════════════════════════════════════════════════
#
# Both machines destroyed via `fly scale count 0 --app nex-brain-worker`
# on 2026-08-09 because the Aug 6 image:
#   · runs pre-Phase-12.3 heartbeat code (mismatched schema)
#   · competes with local dev workers for the same Supabase queue
#   · cannot process image jobs (no access to local filesystem uploads)
#
# The cloud-worker script (scripts/nex-brain-cloud-worker.ts) now
# ENFORCES a startup safeguard · it will refuse to boot unless the
# operator sets NEX_WORKER_CONSENT_V2=YES on Fly. Do NOT blindly
# `fly deploy` this config without first:
#
#   1. Rebuild the image from the CURRENT codebase (post Waves 3-7)
#   2. Set NEX_BRAIN_BACKEND=postgres + NEX_POSTGRES_URL on Fly
#   3. Set NEX_OBJECT_BACKEND=postgres on Fly
#   4. Set NEX_WORKER_CONSENT_V2=YES on Fly
#   5. Deploy with `fly deploy --config deploy/nex-brain-worker/fly.toml`
#
# Otherwise the container fails-fast at startup with a clear error
# pointing at docs/headquarters-production-readiness/
# HEADQUARTERS-WORKER-DEPLOYMENT-AUDIT.md.
#
# ─── Historical deployment procedure (pre-decommission · Aug 6) ────
# Secrets required for BOTH legacy and v2:
#   fly secrets set --app nex-brain-worker \
#     NEX_SUPABASE_URL=https://ijvqdvsvwtwxzcqmoqit.supabase.co \
#     NEX_SUPABASE_SERVICE_ROLE_KEY=eyJ... \
#     GROQ_API_KEY=gsk_... \
#     GOOGLE_GEMINI_API_KEY=AQ.Ab8R... \
#     ANTHROPIC_API_KEY=sk-ant-...
#
# Additional secrets required for v2 (post-Wave-5 flip):
#   NEX_BRAIN_BACKEND=postgres
#   NEX_POSTGRES_URL=postgresql://... (managed Postgres reachable from Fly)
#   NEX_OBJECT_BACKEND=postgres
#   NEX_WORKER_CONSENT_V2=YES

app = "nex-brain-worker"
primary_region = "lhr"          # London — closest to Philip + UK users
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

# Non-secret env. Secrets go through `fly secrets set`.
[env]
  NEX_BRAIN_BACKEND = "supabase"
  NEX_WORKER_INTERVAL_MS = "5000"
  NEX_WORKER_HEARTBEAT_MS = "10000"
  NODE_ENV = "production"

# Worker is a long-running background process, not a web service, but
# we expose /health on port 8080 so Fly can:
#   · verify the container booted (readiness)
#   · restart us if /health goes 503 or the port stops responding
#   · surface logs in the dashboard
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false      # NEVER stop — this is the "always-on" bit
  auto_start_machines = true      # If crashed, boot again
  min_machines_running = 1        # Keep at least one machine live 24/7

  # Expose /health publicly on 443 so we can curl from anywhere
  # (dashboard + local debugging). Fly's built-in TLS handles the cert.
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"          # Cold boot + npm ci layer needs this

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"
    protocol = "http"

# Small VM — this workload is I/O bound (Supabase RPC + LLM HTTP).
# Start at 1x shared CPU / 256MB; scale up if the cycle log shows
# CPU-bound extraction (unlikely — Groq does the heavy lifting).
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"                # 512MB gives headroom; 256MB works too
  size = "shared-cpu-1x"
