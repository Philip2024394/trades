<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Curved walk line">
  <defs>
    <marker id="a" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#F26C1F"/>
    </marker>
  </defs>
  <!-- Smooth quarter-radius sweep from bottom-left to top-right (not a full spiral) -->
  <path d="M40,215 A 175 175 0 0 1 215,40"
        fill="none" stroke="#F26C1F" stroke-width="3" stroke-linecap="round"
        marker-end="url(#a)"/>
  <circle cx="40" cy="222" r="6" fill="#FFFFFF" stroke="#F26C1F" stroke-width="2.5"/>
</svg>
