ai_specialists:
  - id: kitchen_designer
    role: Designer
    capabilities: [design, image_matching, style_recommendation, layout_planning]
  - id: kitchen_engineer
    role: Engineer
    capabilities: [measuring, services_check, structural_advice]
  - id: kitchen_quoter
    role: Quoter
    capabilities: [pricing, quote_generation, appliance_pricing, worktop_pricing]
  - id: kitchen_installer
    role: Installer
    capabilities: [install_guidance, sequencing_advice, snag_resolution]

workspace_objects:
  - type: quote
    fields: [customer_id, kitchen_style, layout_type, cabinet_count, worktop_type, appliance_list, price_total, valid_until]
  - type: project
    fields: [customer_id, status, quote_id, install_date, photos, notes]
  - type: image
    fields: [url, kitchen_style, layout_type, tags, source]
  - type: measurement
    fields: [project_id, room_length_mm, room_width_mm, ceiling_height_mm, existing_services]
  - type: customer
    fields: [name, contact, project_ids, style_preferences, budget_range]

cross_domain_dependencies:
  - timber (cabinet + worktop material knowledge)
  - lighting (kitchen lighting design)
  - electrical (appliance circuits + hob supply)
  - plumbing (sink + dishwasher services)
  - interior_design (style compatibility)
  - regulations (kitchen ventilation + electrical regs)

retrieval_config:
  primary_key: id
  secondary_keys: [tags, category_tag, layout_type, style, worktop_type]
  full_text_fields: [question, answer, title, body]
  vector_embed: false
