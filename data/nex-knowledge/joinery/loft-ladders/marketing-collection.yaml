  - banner_id: loft_ladder_banner_002
    theme_pack: modern_blue
    hero_product_type: timber_folding_loft_ladder
    marketing_tone: professional
    brand_personality: professional
    audience: modern_family
    image_asset: https://ik.imagekit.io/5vv5pw26q/dsdddsddssdasdasdsdddsdasdddsddsd.png

  - banner_id: loft_ladder_banner_003
    theme_pack: industrial_black_red
    hero_product_type: heavy_duty_steel_loft_ladder
    marketing_tone: performance
    brand_personality: industrial_professional
    audience: builder_trade
    image_asset: https://ik.imagekit.io/5vv5pw26q/dsdddsddssdasdasdsdddsdasdddsddsdsd.png

  - banner_id: loft_ladder_banner_004
