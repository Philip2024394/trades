knowledge_id: staircase
knowledge_version: 1.0
domain_number: 001
last_updated: 2026-08-03
maturity_level: silver  # approaching Gold · needs 5+ case studies + calculators for Gold
schema_version: domain_template_v1.1
authored_by: philip
governance:
  rule_a_anti_fabrication: pass
  rule_c_attributable_origin: named_expert = Philip O'Farrell

purpose: >
  Domain 001 (foundation domain) covering everything unique to designing,
  specifying, quoting, manufacturing, and installing bespoke staircases.
  Trade business processes (site visit, quotation, warranty, etc.) are
  INHERITED from _shared/trade-business. Timber finishes are INHERITED from
  _shared/joinery-finishes. Whole-home design coordination is INHERITED from
  _shared/design-coordination. Staircase-specific knowledge lives here.

inherits_from:
  - _shared/trade-business
  - _shared/joinery-finishes
  - _shared/design-coordination

sources:
  faqs:            knowledge/staircase.json    # legacy fallback path · 1980 FAQs preserved
  articles:        articles/                    # new articles · staircase-specific
  brain_docs:      ../../docs/brains/staircase-*.md  # 30+ existing brain docs referenced
  images_index:    ../../data/nex-image-manifest.json  # 820 staircase-domain images

