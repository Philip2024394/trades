router_tags:
  - Design
  - Build
  - Repair
  - Compare
  - Learn

ai_specialists:
  - id: staircase_designer
    role: Designer
    capabilities: [design, image_matching, style_recommendation, layout_planning]
    schema_version: capability_v1.0
  - id: staircase_engineer
    role: Engineer
    capabilities: [calculation, regulation_check, structural_advice, headroom_check]
    schema_version: capability_v1.0
  - id: staircase_quoter
    role: Quoter
    capabilities: [pricing, quote_generation, variant_pricing, component_pricing]
    schema_version: capability_v1.0
  - id: staircase_installer
    role: Installer
    capabilities: [install_guidance, tool_recommendation, escalation_check, site_preparation]
    schema_version: capability_v1.0

workspace_objects:
  - type: quote
    fields: [customer_id, floor_to_floor_mm, style, materials, price_total, valid_until]
  - type: project
    fields: [customer_id, status, quote_id, install_date, photos, notes]
  - type: image
    fields: [url, staircase_kind, staircase_context, tags, source]
  - type: measurement
    fields: [project_id, floor_to_floor_mm, opening_length_mm, opening_width_mm, headroom_mm]
  - type: customer
    fields: [name, contact, project_ids, relationship_notes]

cross_domain_dependencies:
  - timber (materials + species knowledge · shared with kitchen + doors)
  - lighting (concealed LED integration)
  - joinery (manufacturing + fitting knowledge)
  - regulations (Approved Doc K + safety standards)
  - interior_design (style compatibility)
  - kitchen (when coordinated in the same visual space)

retrieval_config:
  primary_key: id
  secondary_keys: [tags, category_tag, staircase_kind, staircase_context]
  full_text_fields: [question, answer, description]
  vector_embed: false
