# NEX Staircase Component Library — PANEL_BACKING family record
#
# Philip 2026-08-03 · Backing substrate for decorative panelling.
# Companion family to PANEL_SYSTEM (panel_system.yaml). Every real
# panel installation selects ONE backing variant from this family.
#
# Master docs: docs/brains/staircase-panelling-backing-fixing-systems-philip-2026-08-03.md
#              docs/brains/staircase-panelling-construction-knowledge-philip-2026-08-03.md

family_id:                  PANEL_BACKING
family_name:                Decorative Panel Backing Substrate
component_type:             panel_backing
non_structural:             true

# ─── Variants supported ────────────────────────────────────────────
variants_supported:
  - DIRECT_PLASTER          # mouldings straight onto sound plaster
  - MR_MDF_6                # 6mm moisture-resistant MDF backing sheet
  - MR_MDF_9                # 9mm MR-MDF (most common for painted)
  - MR_MDF_12               # 12mm MR-MDF (heavier build-up · luxury)
  - PLYWOOD                 # plywood backing (rare · commercial · premium)
  - TREATED_BATTENS         # timber batten grid on unlevel wall
  - SERVICE_VOID            # batten frame with 25-50mm cavity for cables/pipes
  - STUD_FRAME              # full stud framework · rare · commercial

# Per-variant characteristics for quoting + solver logic
variant_specs:
  DIRECT_PLASTER:
    thickness_mm:                 0
    fixing_method:                adhesive_only_or_adhesive_plus_pins
    suitable_wall_types:          [sound_plaster, sound_plasterboard]
    labour_time_relative:         1.0     # baseline
    cable_cavity_depth_mm:        0
    suitable_for_leds:            false
    cost_relative:                1.0     # baseline
    notes:                        "Cheapest and fastest · wall must be reasonably flat · cannot hide services"
  MR_MDF_6:
    thickness_mm:                 6
    fixing_method:                adhesive_plus_countersunk_screws
    suitable_wall_types:          [plaster, plasterboard, block, brick_via_battens]
    labour_time_relative:         1.4
    cable_cavity_depth_mm:        0
    suitable_for_leds:            false
    cost_relative:                1.3
    notes:                        "Common retrofit · adds 6mm · flat surface for mouldings"
  MR_MDF_9:
    thickness_mm:                 9
    fixing_method:                adhesive_plus_countersunk_screws
    suitable_wall_types:          [plaster, plasterboard, block, brick_via_battens]
    labour_time_relative:         1.5
    cable_cavity_depth_mm:        0
    suitable_for_leds:            false
    cost_relative:                1.4
    notes:                        "Most common backing for painted Shaker · flat + stable"
  MR_MDF_12:
    thickness_mm:                 12
    fixing_method:                adhesive_plus_countersunk_screws
    suitable_wall_types:          [plaster, plasterboard, block, brick_via_battens]
    labour_time_relative:         1.7
    cable_cavity_depth_mm:        0
    suitable_for_leds:            false
    cost_relative:                1.6
    notes:                        "Luxury · heavier build-up · used with deep mouldings"
  PLYWOOD:
    thickness_mm:                 12
    fixing_method:                adhesive_plus_countersunk_screws
    suitable_wall_types:          [plaster, plasterboard, timber_stud, steel_stud]
    labour_time_relative:         1.6
    cable_cavity_depth_mm:        0
    suitable_for_leds:            false
    cost_relative:                1.8
    notes:                        "Premium · birch ply is common · rare in domestic panel work"
  TREATED_BATTENS:
    thickness_mm:                 25     # nominal batten depth (25 × 38 or 25 × 50)
    fixing_method:                masonry_screws_or_wood_screws
    suitable_wall_types:          [uneven_plaster, block, brick, timber_stud]
    labour_time_relative:         2.0
    cable_cavity_depth_mm:        25
    suitable_for_leds:            true
    cost_relative:                1.5
    notes:                        "Levels uneven wall · creates shallow cable void · pairs with MR_MDF_9/12 on top"
  SERVICE_VOID:
    thickness_mm:                 50     # deeper batten grid
    fixing_method:                masonry_screws_or_wood_screws
    suitable_wall_types:          [uneven_plaster, block, brick, timber_stud]
    labour_time_relative:         2.5
    cable_cavity_depth_mm:        50
    suitable_for_leds:            true
    cost_relative:                1.9
    notes:                        "Full service void · holds cables, LED drivers, pipes, alarm wiring · always pairs with MR_MDF_9/12 or plywood face"
  STUD_FRAME:
    thickness_mm:                 89     # nominal timber stud
    fixing_method:                framing_screws_or_nails
    suitable_wall_types:          [existing_wall_furring, freestanding]
    labour_time_relative:         3.5
    cable_cavity_depth_mm:        89
    suitable_for_leds:            true
    cost_relative:                2.5
    notes:                        "Full stud framework · rare · commercial or where a new independent wall is required"

# ─── Provenance ────────────────────────────────────────────────────
created_at:                 2026-08-03T00:00:00Z
created_by:                 philip
revision:                   1
review_status:              reviewed
authoring_source:           "Philip O'Farrell · direct written contribution 2026-08-03"

notes:
  - Runtime type follow-up · types.ts ComponentType enum must add "panel_backing".
  - Backing selection drives thickness, cost, labour hours + LED viability.
  - Direct-to-plaster is the cheapest; service-void frame is the most expensive
    but the only option when hidden services / LED drivers are required.
