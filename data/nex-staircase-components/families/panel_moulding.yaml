# NEX Staircase Component Library — PANEL_MOULDING family record
#
# Philip 2026-08-03 · Decorative moulding profiles ("slips") applied
# onto backing to form panel frames. Companion family to PANEL_SYSTEM.
#
# Every real panel installation selects one primary moulding profile
# and applies it uniformly across the whole project. Consistency
# matters more than absolute panel dimension.
#
# Master docs: docs/brains/staircase-panelling-layout-slip-materials-philip-2026-08-03.md

family_id:                  PANEL_MOULDING
family_name:                Decorative Panel Mouldings (Slips)
component_type:             panel_moulding
non_structural:             true

# ─── Variants supported ────────────────────────────────────────────
variants_supported:
  - OGEE_18
  - OGEE_22
  - OGEE_32
  - BOLECTION_32
  - BOLECTION_45
  - ASTRAGAL
  - BEAD
  - LAMBS_TONGUE
  - CHAMFER
  - SQUARE_EDGE
  - SHADOW_GAP
  - SHAKER_18
  - SHAKER_22
  - SHAKER_25

