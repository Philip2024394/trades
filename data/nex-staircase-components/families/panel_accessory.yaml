notes:
  - Runtime type follow-up · types.ts ComponentType enum must add "panel_accessory".
  - Consumables (adhesive · pins · caulk · filler · primer · paint) are usually
    the single most overlooked line on a panel quote. This family exists so
    Nex never quotes a panel job without them.
  - LED_DRIVER location rule mirrors the access-panel rule from the
    add-later + future-proofing brain doc — never permanently sealed.
