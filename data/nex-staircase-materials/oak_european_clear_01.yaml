review_status:              reviewed   # awaiting Philip's lock

source_notes: >
  Density and Janka hardness values are typical industry references
  for European Oak, not measured from a specific batch. Philip should
  confirm against workshop supplier data before locking. Colour, grain,
  and finish compatibility descriptors are qualitative and reflect
