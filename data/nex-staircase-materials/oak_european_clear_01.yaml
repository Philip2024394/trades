notes:
  - First material component. Establishes the Principle 7 pattern:
    materials are first-class references, not embedded strings.
  - Assemblies now use `material_ref: OAK_EUROPEAN_CLEAR_01` instead
    of `materials: [oak]`. Old-form materials list kept in schema for
    backwards compatibility with Assemblies 01 + 02.
  - Additional material components (American White Oak, Ash, Walnut,
